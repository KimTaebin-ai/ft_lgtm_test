# F-M0-02 더미 backend. 이후 피처가 호스트별로 실제 서비스로 교체한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-lgtm
  namespace: dummy
  labels: {app: dummy-lgtm}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dummy-lgtm}
  template:
    metadata:
      labels: {app: dummy-lgtm}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=lgtm-dummy"]
          ports:
            - containerPort: 5678
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-lgtm
  namespace: dummy
spec:
  selector: {app: dummy-lgtm}
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dummy-lgtm
  namespace: dummy
spec:
  ingressClassName: traefik
  rules:
    - host: lgtm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dummy-lgtm
                port: {number: 80}
