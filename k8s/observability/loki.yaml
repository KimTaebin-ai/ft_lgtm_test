# F-M1-01 Loki. single binary(-target=all), filesystem, schema v13 + tsdb, structured metadata, OTLP(/otlp).
# 근거: https://grafana.com/docs/loki/v3.7.x/send-data/otel/
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # structured metadata 는 schema v13 + tsdb 가 필요하다
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # OTLP 로 들어온 trace_id/span_id 가 structured metadata 로 저장된다 (PRD 8.5)
      allow_structured_metadata: true

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels: {app: loki}
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: observability
  labels: {app: loki}
spec:
  replicas: 1
  serviceName: loki
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          imagePullPolicy: IfNotPresent
          args:
            - -target=all
            - -config.file=/etc/loki/loki.yaml
          env:
            - {name: GOMEMLIMIT, value: 400MiB}
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 2Gi}
