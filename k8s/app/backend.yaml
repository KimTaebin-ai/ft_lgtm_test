# F-M1-03 backend. image 는 make deploy 가 __BACKEND_IMAGE__ 를 소스 hash 태그로 치환한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lgtm
  labels: {app: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: COMPILER_URL, value: "http://compiler.lgtm.svc.cluster.local/compile"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # F-M2-03 실측 (동시 N건이 각각 9MB 를 쥐고 5초 spin, cgroup memory.peak): N=1 27MB / N=4 70MB / N=8 122MB / N=16 232MB.
            # F-M2-04 로 처리 2 + 대기 8 로 묶임. 실측 (VM arm64, backend 재시작 후 동시 20건 → 처리 10, 429 10):
            #   idle 11MB, 실행 중 memory.current 43~63MB, memory.peak 70MB (m2-04-memprobe.log). 재시작·OOMKilled 0.
            #   limit 256Mi = peak 의 약 3.8배 (compile 응답 wasm 버퍼·GC 여유), request 64Mi = idle + 처리 2건분 (peak 근처).
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 1, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lgtm
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# /healthz 는 노출하지 않는다. lgtm.local 의 / 는 dummy(k8s/dummy) 그대로 (F-M4-01에서 교체).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: lgtm
spec:
  ingressClassName: traefik
  rules:
    - host: lgtm.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 80}
