# F-M1-03 backend. image 는 make deploy 가 __BACKEND_IMAGE__ 를 소스 hash 태그로 치환한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lgtm
  labels: {app: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: COMPILER_URL, value: "http://compiler.lgtm.svc.cluster.local/compile"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # F-M2-03 실측 (VM arm64, 동시 N건이 각각 9MB 를 쥐고 5초 spin 할 때 cgroup memory.peak):
            #   idle 10MB / N=1 27MB / N=4 70MB / N=8 122MB / N=16 232MB → 동시 요청당 약 +14MB. 동시성 상한은 F-M2-04.
            #   limit 512Mi = N=16 실측(232MB)의 2배 이상. request 는 idle + 몇 건 동시 실행 분.
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lgtm
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# /healthz 는 노출하지 않는다. lgtm.local 의 / 는 dummy(k8s/dummy) 그대로 (F-M4-01에서 교체).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: lgtm
spec:
  ingressClassName: traefik
  rules:
    - host: lgtm.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 80}
