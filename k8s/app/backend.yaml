# backend. image 는 make deploy 가 __BACKEND_IMAGE__ 를 소스 hash 태그로 치환한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lgtm
  labels: {app: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      # 종료 시 preStop 10s (Traefik 이 endpoint 제거를 반영할 시간) + Shutdown 상한 60s (cmd/api/main.go) + 여유 = 75s.
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: COMPILER_URL, value: "http://compiler.lgtm.svc.cluster.local/compile"}
            - {name: IPFS_API_URL, value: "http://kubo-api.ipfs.svc.cluster.local:5001"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            # SIGTERM 전에 10초 더 요청을 받는다. Traefik 이 endpoint 제거를 반영하기 전에 사라진 pod IP 로 보내면 30초 뒤 504 가 난다.
            preStop: {sleep: {seconds: 10}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # 처리 2 + 대기 8 에서 동시 20건 peak 약 70MB. limit 512Mi 는 최악 조합(처리 2건 모두 10MiB + 큰 wasm 응답) 여유다.
            # OOMKill 이면 큐의 요청 10건이 모두 사라진다. request 64Mi = idle + 처리 2건분.
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 1, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lgtm
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# /healthz 는 노출하지 않는다. lgtm.local 의 / 는 frontend (k8s/app/frontend.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: lgtm
spec:
  ingressClassName: traefik
  rules:
    - host: lgtm.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 80}
