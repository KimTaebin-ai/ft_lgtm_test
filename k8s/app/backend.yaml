# F-M1-03 backend. image 는 make deploy 가 __BACKEND_IMAGE__ 를 소스 hash 태그로 치환한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lgtm
  labels: {app: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      # F-M6-04: 종료 시 preStop 10s (Traefik 이 endpoint 제거를 반영할 시간) + Shutdown 상한 60s (cmd/api/main.go) + 여유 = 75s.
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: COMPILER_URL, value: "http://compiler.lgtm.svc.cluster.local/compile"}
            - {name: IPFS_API_URL, value: "http://kubo-api.ipfs.svc.cluster.local:5001"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            # F-M6-04: SIGTERM 전에 10초 더 요청을 받는다. rollout 직후 Traefik 이 이미 사라진 pod IP 로 보내 30초 뒤 504 가 났다 (m6-04 타임라인).
            preStop: {sleep: {seconds: 10}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # F-M2-03 실측 (동시 N건이 각각 9MB 를 쥐고 5초 spin, cgroup memory.peak): N=1 27MB / N=4 70MB / N=8 122MB / N=16 232MB.
            # F-M2-04: 처리 2 + 대기 8 로 묶인 뒤 동시 20건 실측 (VM arm64) idle 11MB, memory.current 43~63MB, memory.peak 70MB.
            #   limit 은 512Mi 유지: 최악 조합(처리 2건이 모두 10MiB 한도 + 큰 wasm compile 응답이 겹침)은 실측하지 않았고,
            #   OOMKill 이면 큐에 있던 요청 10건이 모두 사라진다. request 64Mi = idle + 처리 2건분 (peak 근처).
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 1, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lgtm
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# /healthz 는 노출하지 않는다. lgtm.local 의 / 는 dummy(k8s/dummy) 그대로 (F-M4-01에서 교체).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: lgtm
spec:
  ingressClassName: traefik
  rules:
    - host: lgtm.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 80}
