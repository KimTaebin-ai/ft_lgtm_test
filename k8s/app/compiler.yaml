# compiler. image 는 make deploy 가 __COMPILER_IMAGE__ 를 소스 hash 태그로 치환한다. Ingress 없음 (ClusterIP only).
# resources: 동시 compile 2개 합계 limit 2Gi, request 256Mi.
# 하드닝: readOnlyRootFilesystem(쓰기는 emptyDir /work 만), enableServiceLinks false, NetworkPolicy(아래), 소스 deny-list(서비스 코드).
apiVersion: apps/v1
kind: Deployment
metadata: {name: compiler, namespace: lgtm, labels: {app: compiler}}
spec:
  replicas: 1
  selector: {matchLabels: {app: compiler}}
  template:
    metadata: {labels: {app: compiler}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false # 다른 Service 주소가 환경변수로 주입되지 않게
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: compiler
          image: __COMPILER_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: compiler, namespace: lgtm, labels: {app: compiler}}
spec:
  type: ClusterIP
  selector: {app: compiler}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# backend(app=backend)에서 8080 만 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: compiler-ingress, namespace: lgtm}
spec:
  podSelector: {matchLabels: {app: compiler}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: backend}}
      ports:
        - {protocol: TCP, port: 8080}
---
# DNS(53)와 otel-collector 4317 만 나간다. 외부·다른 Service 로는 나갈 수 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: compiler-egress, namespace: lgtm}
spec:
  podSelector: {matchLabels: {app: compiler}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app: otel-collector}}
      ports:
        - {protocol: TCP, port: 4317}
